name: ifinance
description: "IFinance — Controle financeiro na palma da sua mão. By Ivoney Ferreira."
publish_to: 'none'

version: 1.0.10+11

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # Localização pt-BR dos componentes do Material/Cupertino (date picker em português)
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management
  provider: ^6.1.5+1
  # Local persistence (document DB + key-value)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  # Utilidades
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.3.2
  crypto: ^3.0.6
  # IA real do Assessor (cliente HTTP)
  http: ^1.5.0
  pdf: ^3.12.0
  printing: ^5.14.3
  file_picker: ^11.0.3
  qr: ^3.0.2
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  local_auth: ^3.0.1
  passkeys: ^2.23.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
