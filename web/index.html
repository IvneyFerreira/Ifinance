<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="IFinance — Controle financeiro na palma da sua mão. By Ivoney Ferreira.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="IFinance">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>IFinance</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Persistência de armazenamento (PWA): pede ao navegador para NÃO
    // descartar o IndexedDB (Hive) nem o localStorage (preferências) sob
    // pressão de armazenamento — principal causa de "dados sumindo" numa
    // atualização no Web. No Android o espaço de dados é preservado.
    (function () {
      try {
        if (navigator.storage && navigator.storage.persisted) {
          navigator.storage.persisted().then(function (already) {
            if (!already && navigator.storage.persist) {
              navigator.storage.persist().then(function (granted) {
                console.log('[IFinance] Armazenamento persistente:', granted);
              });
            }
          });
        }
      } catch (e) {
        console.warn('[IFinance] persist() indisponível:', e);
      }
    })();
  </script>
</head>
<body>
  <!-- Passkeys (WebAuthn) — biblioteca JS requerida pelo pacote passkeys no Web. -->
  <script
    src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js"
    type="application/javascript"
  ></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
